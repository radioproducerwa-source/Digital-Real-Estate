name: Weekly Mechanic Blog Publish

on:
  schedule:
    # Every Monday at 01:00 UTC = 09:00 AWST (UTC+8)
    - cron: '0 1 * * 1'
  workflow_dispatch:
    # Allow manual trigger for testing

jobs:
  publish-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run publish_next.py
        id: publish
        working-directory: perthmechanic
        run: |
          python3 publish_next.py | tee /tmp/publish_output.txt
          # Extract outputs for use in subsequent steps
          SLUG=$(grep '^PUBLISHED_SLUG=' /tmp/publish_output.txt | cut -d= -f2)
          TITLE=$(grep '^PUBLISHED_TITLE=' /tmp/publish_output.txt | cut -d= -f2-)
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          cat /tmp/publish_output.txt

      - name: Commit and push published post
        if: steps.publish.outputs.slug != ''
        run: |
          git config user.name "Perth Mechanic Bot"
          git config user.email "bot@perthmechanic.com"
          git add perthmechanic/
          git commit -m "Publish blog: ${{ steps.publish.outputs.title }}"
          git push origin HEAD
